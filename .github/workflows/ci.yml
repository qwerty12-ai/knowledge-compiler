name: Knowledge Compiler CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-26.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: knowledge_compiler
          MYSQL_USER: knowledge_compiler
          MYSQL_PASSWORD: knowledge_compiler_password
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: knowledge_compiler
      MYSQL_USER: knowledge_compiler
      MYSQL_PASSWORD: knowledge_compiler_password
      MYSQL_ROOT_PASSWORD: rootpassword
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install compiler dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./compiler[dev]"

      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest requests

      - name: Initialize database schema
        run: mysql -h 127.0.0.1 -u root -prootpassword knowledge_compiler < database/schema.sql

      - name: Run compiler tests
        run: python -m pytest compiler/tests/ -v

      - name: Run backend tests
        run: python -m pytest backend/tests/ -v
        env:
          RUN_DOCKER_AI_INTEGRATION: "0"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build