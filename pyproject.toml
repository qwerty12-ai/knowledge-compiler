[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-compiler"
version = "0.1.0"
description = "An evidence-backed enigneering knowledge compiler for software repositories."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [{name = "Mohd Abdul Sabeeh"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
knowledge-compiler = "knowledge-compiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
